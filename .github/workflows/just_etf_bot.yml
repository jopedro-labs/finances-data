name: Test JustETF Client

on:
  push:
    paths:
      - 'finances_data/just_etf/**'
      - 'test/test_just_etf.py'
  workflow_dispatch:

jobs:
  test-just-etf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] --verbose 2>&1 | tail -30

      - name: Run JustETF tests
        id: tests
        run: |
          python -m pytest test/test_just_etf.py --tb=short -q 2>&1 | tee test_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        shell: bash
        continue-on-error: true

      - name: Set test result output
        id: result
        run: |
          if [ "${{ steps.tests.outputs.exit_code }}" = "0" ]; then
            echo "result=ok" >> $GITHUB_OUTPUT
          else
            echo "result=error" >> $GITHUB_OUTPUT
          fi

      - name: Upload test output on failure
        if: steps.result.outputs.result == 'error'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: just-etf-test-output
          path: test_output.txt

      - name: Send Discord notification
        if: always()
        env:
          INFRA_ALERTS_DISCORD_WEBHOOK: ${{ secrets.INFRA_ALERTS_DISCORD_WEBHOOK }}
          TEST_RESULT: ${{ steps.result.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_discord.py