name: Monitor Yahoo Finance API

on:
  schedule:
    - cron: '0 20 * * 4'
  workflow_dispatch:

jobs:
  check-yahoo-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Yahoo Finance Monitor Bot
        id: check
        env:
          INFRA_ALERTS_DISCORD_WEBHOOK: ${{ secrets.INFRA_ALERTS_DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/yahoo_health_check.py
        continue-on-error: true

      - name: Upload Error Logs on Failure
        if: steps.check.outputs.result == 'error'
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-monitor-error-log
          path: logs/yahoo_monitor.log
