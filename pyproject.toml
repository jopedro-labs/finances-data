[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finances-data"
version = "0.1.0"
description = "Finance data infrastructure clients"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "yfinance>=0.2",
    "urllib3>=2.0",
    "jopedro-core-lib>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests>=2.28",
    "types-beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "google-generativeai>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["finances_data*", "data*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
files = ["finances_data", "data", "scripts", "tests"]

[[tool.mypy.overrides]]
module = [
    "bs4.*",
    "yfinance.*",
    "pandas.*",
    "core_lib.*",
    "google.generativeai.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.test_just_etf",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short --cov=finances_data --cov=data --cov-report=term-missing"

[tool.coverage.run]
source = ["finances_data", "data"]

[tool.coverage.report]
show_missing = true

[[tool.mypy.overrides]]
module = [
    "scripts.quality_eval_agent",
]
ignore_errors = true
